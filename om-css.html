<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om CSS</title>
    <!--Exempel på external CSS-->
    <link rel="stylesheet" type="text/css" href="styles.css">

    <!--Exempel på internal CSS-->
    <style>
        li {
            background-color: lightblue;
            color: darkred;
        }

        body {
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <h1 style="background-color:blueviolet;">Om CSS</h1><!--exempel på inline css.-->
    <p>CSS (Cascading Style Sheets) är ett språk som används för att beskriva utseendet och formateringen av ett dokument skrivet i HTML. Med CSS kan du styra layout, färger, typsnitt och andra visuella aspekter av webbsido </p>
    <h2>Olika typer av CSS</h2>
    <ul>
        <li>Inline CSS</li>
        <li>Internal CSS</li>
        <li>External CSS</li>
    </ul>
</body>
</html>
